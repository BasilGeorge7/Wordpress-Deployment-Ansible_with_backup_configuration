---
- name: "wordpress Installation"
  hosts: wordpress
  vars_files:
    - variable.yml
  become: yes
  tasks:
    - name: "yum update"
      yum:
        name: '*'
        state: latest

    - name: "package Installation"
      yum:
        name: "{{ packages }}"
        state: present

    - name: "download latest wordpress"
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz

    - name: "Extract and move to document root"
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /var/www/html/
        remote_src: yes

    - name: "Copying"
      copy:
        src: /var/www/html/wordpress/
        dest: /var/www/html/
        remote_src: yes

    - name: " Remove Wordpress folder"
      file:
        path: /var/www/html/wordpress
        state: absent

    - name: "Restart apache"
      service:
        name: httpd
        state: restarted
        enabled: true

    - name: "copy configuration files"
      copy:
        src: ./wordpress.conf
        dest: /etc/httpd/conf.d/wordpress.conf

    - name: "Copy of wp-config"
      copy:
        src: ./wp-config.php
        dest: /var/www/html/
