---
- name: "wordpress Installation"
  hosts: wordpress
  vars_files:
    - variable.yml
  become: yes
  tasks:
    - name: "yum update"
      yum:
        name: '*'
        state: latest

    - name: "package Installation"
      yum:
        name: "{{ packages }}"
        state: present

    - name: "download latest wordpress"
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz

    - name: "Extract in tmp itself"
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: "Copying"
      copy:
        src: /tmp/wordpress/
        dest: /var/www/html/
        remote_src: yes

    - name: "copy configuration files"
      copy:
        src: ./wordpress.conf
        dest: /etc/httpd/conf.d/wordpress.conf

    - name: "Copy of wp-config"
      template:
        src: ./wp-config.php
        dest: /var/www/html/

    - name: "Restart service"
      service:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: "{{ services }}"

    - name: Install PyMySQL
      pip:
        name: PyMySQL
        executable: pip3
  
    - name: "Mysql Installation"
      mysql_user:
        name: root
        password: "{{root_password}}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        host: localhost
        login_user: root
        login_password: ''
        state: present
      ignore_errors: true

    - name: "Database creation"
      mysql_db:
        name: "{{database}}"
        state: present
        login_user: root
        login_password: "{{root_password}}"
        login_unix_socket: /var/lib/mysql/mysql.sock
    
    - name: "User creation with access to database"
      mysql_user:
        name: "{{admin}}"
        password: "{{admin_password}}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        host: localhost
        login_user: root
        login_password: "{{root_password}}"
        state: present
        priv: "{{ database }}.*: ALL,GRANT"

    - name: "Copy of backup-script"
      template:
        src: ./backup.sh
        dest: /var/

    - name: "Copy of backup-script"
      template:
        src: ~/ansible.pem
        dest: /var/

    - name: Run script every 5 minutes
      cron:
        name: "Backup cron"
        minute: "*/15"
        job: "/var/backup.sh"

    - name: "Restart service"
      service:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: "{{ services }}"



  
