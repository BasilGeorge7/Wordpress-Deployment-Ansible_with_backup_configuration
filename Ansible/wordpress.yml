---
- name: "wordpress Installation"
  hosts: wordpress
  vars_files:
    - variable.yml
  become: yes
  tasks:
    - name: "yum update"
      yum:
        name: '*'
        state: latest

    - name: "package Installation"
      yum:
        name: "{{ packages }}"
        state: present

    - name: "download latest wordpress"
      get_url:
        url: https://wordpress.org/latest.tar.gz
        dest: /tmp/wordpress.tar.gz

    - name: "Extract in tmp itself"
      unarchive:
        src: /tmp/wordpress.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: "Copying"
      copy:
        src: /tmp/wordpress/
        dest: /var/www/html/
        remote_src: yes

    - name: "copy configuration files"
      copy:
        src: ./wordpress.conf
        dest: /etc/httpd/conf.d/wordpress.conf

    - name: "Copy of wp-config"
      copy:
        src: ./wp-config.php
        dest: /var/www/html/

    - name: "Restart service"
      service:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop: "{{ services }}"

    - name: "Mysql Installation"
      mysql_user:
        name: root
        password: "{{root_password}}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        host: localhost
        login_user: root
        login_password: ''
        state: present

    - name: "Database creation"
      mysql_db:
        name: "{{database}}"
        state: present
        login_name: root
        login_password: "{{root_password}}"
        login_unix_socket: /run/mysqld/mysqld.sock
    
    - name: "User creation with access to database"
      mysql_user:
        name: "{{admin}}"
        password: "{{admin_password}}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        host: localhost
        login_user: root
        login_password: "{{root_password}}"
        state: present
        priv:
          '"{{"database"}}".*': 'ALL,GRANT'

          

  
